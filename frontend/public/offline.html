<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sin conexión · MultiCatálogo</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#1e293b;font-family:system-ui,sans-serif;padding:24px;text-align:center}
      main{max-width:360px}
      img{width:96px;height:96px;border-radius:20px}
      h1{font-size:1.4rem;margin:16px 0 8px}
      p{color:#475569;line-height:1.5;margin:0 0 20px}
      button{min-height:44px;padding:0 24px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:600;font-size:1rem;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="MultiCatálogo" />
      <h1>Sin conexión</h1>
      <p>No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo. El catálogo que ya visitaste sigue disponible.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
