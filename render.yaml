# render.yaml — Blueprint de Render: crea la base de datos, la caché, la API (Go) y el sitio (React/PWA).
# Se usa desde Render: New + → Blueprint → elegir este repositorio.
databases:
  - name: catalogo-upse-db
    databaseName: multicatalogo
    user: catalogo_user
    plan: free
    region: ohio

services:
  # Caché Redis (opcional: si no responde, la API sigue funcionando sin caché).
  - type: keyvalue
    name: catalogo-upse-cache
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # solo accesible desde dentro de Render

  # API REST en Go/Fiber (se construye con backend/Dockerfile).
  - type: web
    name: catalogo-upse-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catalogo-upse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: catalogo-upse-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto largo y aleatorio
      - key: APP_ENV
        value: prod
      - key: CORS_ORIGINS
        sync: false # se pide al crear: la URL del sitio, ej. https://catalogo-upse-web.onrender.com

  # Sitio estático: la SPA React (PWA) construida con Vite.
  - type: web
    name: catalogo-upse-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false # se pide al crear: la URL de la API, ej. https://catalogo-upse-api.onrender.com
    routes:
      # React Router: cualquier ruta que no sea un archivo devuelve index.html (si no, recargar /catalogo da 404).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # El service worker nunca debe quedarse en caché del navegador/CDN, o las actualizaciones no llegan.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
